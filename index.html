<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Salesforce World // Exploration RPG & Architecture Atlas</title>
  <link rel="stylesheet" href="./src/styles/pixel-city.css" />
</head>
<body>

  <!-- Canvas (Dual-Mode: Explore RPG World & 2.5D Isometric Masterplan) -->
  <canvas id="city-canvas"></canvas>

  <!-- Architectural Drafting Grid Overlay (active in Atlas mode) -->
  <div class="drafting-grid"></div>

  <!-- Vellum Edge Vignette -->
  <div class="vellum-vignette"></div>

  <!-- Top Navigation & Control Bar -->
  <header class="arch-header">
    <!-- Brand & Org Identification -->
    <div class="arch-brand">
      <div class="arch-logo">SF</div>
      <div>
        <div class="arch-title">
          <span>SALESFORCE WORLD</span>
          <span class="datum-tag" style="border-color: rgba(0, 240, 255, 0.4); color: #00f0ff;">v66.0</span>
        </div>
        <div class="arch-subtitle">RETRO RPG EXPLORER & ARCHITECTURE ATLAS</div>
      </div>
    </div>

    <!-- Dual View Layer Switcher: [ 🎮 Explore ]  [ 🏛️ Atlas ] -->
    <div class="view-mode-segmented">
      <button id="btn-mode-explore" class="view-mode-btn active" title="Top-Down Handcrafted RPG Exploration (V)">
        🎮 Explore (RPG)
      </button>
      <button id="btn-mode-atlas" class="view-mode-btn" title="2.5D Axonometric Architecture Masterplan (V)">
        🏛️ Atlas (2.5D)
      </button>
    </div>

    <!-- Architectural Zoning / District Filter (Atlas Mode) -->
    <div class="program-selector">
      <button data-filter="all" class="filter-btn program-btn active">All</button>
      <button data-filter="metadata" class="filter-btn program-btn">1. Metadata</button>
      <button data-filter="automation" class="filter-btn program-btn">2. Automation</button>
      <button data-filter="semantic" class="filter-btn program-btn">3. Semantic</button>
      <button data-filter="headless" class="filter-btn program-btn">4. Headless</button>
      <button data-filter="agentforce" class="filter-btn program-btn">5. Agentforce</button>
      <button data-filter="claudeforce" class="filter-btn program-btn">6. Claudeforce</button>
      <button data-filter="mcp" class="filter-btn program-btn">7. MCP</button>
    </div>

    <!-- Action Tools -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- Field Guide Button -->
      <button id="btn-open-guide" class="action-btn-primary" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border-color: rgba(56, 189, 248, 0.4);" title="Open Architectural Field Guide (G)">
        <span>📖</span>
        <span id="guide-badge">Guide (0/17)</span>
      </button>

      <!-- Universal Search Button -->
      <button id="btn-open-search" class="action-btn-ghost" style="border: 1px solid rgba(255, 255, 255, 0.12); padding: 5px 12px; gap: 6px;" title="Universal Search (⌘K)">
        <span>🔍</span>
        <span class="datum-tag" style="font-size: 9px;">⌘K</span>
      </button>

      <!-- Guided Tour Button -->
      <button id="btn-start-tour" class="action-btn-ghost" title="Start Guided Tour (T)">
        🧭 Tour
      </button>

      <!-- Concept Studio Button -->
      <button id="btn-open-academy" class="action-btn-ghost" title="System Architecture Studio">
        🏛️ Studio
      </button>

      <!-- Interactive Scenario Button -->
      <button id="btn-run-simulation" class="action-btn-primary" style="background: linear-gradient(135deg, #059669 0%, #065f46 100%); border-color: rgba(16, 185, 129, 0.4);" title="Cold-Chain Emergency Scenario (Space)">
        <span>⚡</span>
        <span>Rescue Scenario</span>
      </button>

      <button id="btn-shortcuts" class="action-btn-ghost" title="Keyboard Shortcuts (?)">
        ⌨️
      </button>

      <button id="btn-toggle-sound" class="action-btn-ghost" title="Mute Audio (M)">
        🔊
      </button>
    </div>
  </header>

  <!-- Mobile On-Screen Virtual Controls (D-Pad & Action Button) -->
  <div class="mobile-controls">
    <div class="dpad-container">
      <div></div>
      <button class="dpad-btn" id="dpad-up">▲</button>
      <div></div>
      <button class="dpad-btn" id="dpad-left">◀</button>
      <div></div>
      <button class="dpad-btn" id="dpad-right">▶</button>
      <div></div>
      <button class="dpad-btn" id="dpad-down">▼</button>
      <div></div>
    </div>
    <button class="mobile-action-btn" id="mobile-btn-action">
      [ E ]
    </button>
  </div>

  <!-- Interactive Simulation Controller Container -->
  <div id="simulation-controller-container" class="hidden"></div>

  <!-- Guided Tour Container -->
  <div id="guided-tour-container" class="hidden"></div>

  <!-- Field Guide Modal -->
  <div id="field-guide-modal" class="hidden"></div>

  <!-- Command Palette Modal -->
  <div id="command-palette-modal" class="hidden"></div>

  <!-- Slide-Over Architectural Dossier -->
  <aside id="building-inspector" class="hidden"></aside>

  <!-- Bottom Scale & Status Dock -->
  <footer class="arch-dock">
    <div style="display: flex; align-items: center; gap: 8px; overflow-x: auto;">
      <span style="font-size: 10px; color: #64748b; font-family: 'JetBrains Mono', monospace; text-transform: uppercase;">FAST TRAVEL:</span>
      <button data-target="b_standard_objects" class="district-jump-btn program-btn" style="color: #38bdf8;">1. Metadata</button>
      <button data-target="b_apex_foundry" class="district-jump-btn program-btn" style="color: #f59e0b;">2. Automation</button>
      <button data-target="b_data_lake" class="district-jump-btn program-btn" style="color: #06b6d4;">3. Semantic Harbor</button>
      <button data-target="b_headless_gateway" class="district-jump-btn program-btn" style="color: #10b981;">4. Headless</button>
      <button data-target="b_agentforce_core" class="district-jump-btn program-btn" style="color: #a855f7;">5. Agentforce</button>
      <button data-target="b_claudeforce_lab" class="district-jump-btn program-btn" style="color: #f97316;">6. Claudeforce</button>
      <button data-target="b_mcp_context" class="district-jump-btn program-btn" style="color: #ec4899;">7. Dual MCPs</button>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; font-size: 11px; color: #64748b; font-family: 'JetBrains Mono', monospace;">
      <span><strong>WASD / ARROWS</strong>: MOVE</span> • <span><strong>E</strong>: INTERACT</span> • <span><strong>V</strong>: TOGGLE ATLAS</span> • <span><strong>⌘K</strong>: SEARCH</span>
    </div>
  </footer>

  <!-- Architectural Concept Studio Modal -->
  <div id="concept-modal" class="hidden"></div>

  <!-- Keyboard Shortcuts Cheatsheet Modal -->
  <div id="shortcuts-modal" class="hidden"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
