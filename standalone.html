:root {
  --canvas-bg: #090d16;
  --drafting-board: #060911;
  --grid-line: rgba(255, 255, 255, 0.05);
  --grid-major: rgba(255, 255, 255, 0.12);

  --ui-card: rgba(18, 27, 46, 0.75);
  --ui-border: rgba(255, 255, 255, 0.1);
  --ui-border-active: rgba(56, 189, 248, 0.45);

  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;

  --arch-cyan: #00f0ff;
  --arch-blue: #38bdf8;
  --arch-indigo: #6366f1;
  --arch-purple: #a855f7;
  --arch-emerald: #10b981;
  --arch-amber: #f59e0b;
  --arch-vermilion: #ff453a;
  --arch-pink: #ec4899;

  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--drafting-board);
  color: var(--text-primary);
  font-family: var(--font-sans);
  user-select: none;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

/* Background Canvas */
#city-canvas {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  display: block !important;
  z-index: 1 !important;
  background-color: var(--drafting-board);
  cursor: grab;
}

#city-canvas:active {
  cursor: grabbing;
}

/* Architectural Drafting Grid Overlay */
.drafting-grid {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background-image: 
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
  -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
  opacity: 0.8;
}

/* Drafting Vellum Vignette */
.vellum-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
}

/* Top Architectural Navigation Bar */
.arch-header {

  top: 20px;
  left: 20px;
  right: 20px;

  border-radius: 12px;

}

/* Brand Identity */

  align-items: center;

}

.arch-logo {

  <script>
    
(function() {
  /**
 * Synthesized 8-Bit Web Audio API Sound System
 * Zero external audio files required. Crisp retro synthesizer sound fx.
 */

class SoundFx {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.initialized = false;
  }

  init() {
    if (this.initialized) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
        this.initialized = true;
      }
    } catch (e) {
      console.warn('Web Audio not supported or blocked:', e);
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }

  playBeep(freq = 440, duration = 0.08, type = 'square', gainVal = 0.08) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }

    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {
      // Audio autoplay policy catch
    }
  }

  click() {
    this.playBeep(520, 0.05, 'triangle', 0.06);
  }

  buildingSelect() {
    if (this.muted) return;
    this.playBeep(440, 0.06, 'square', 0.08);
    setTimeout(() => this.playBeep(660, 0.09, 'square', 0.08), 50);
  }

  districtSelect() {
    if (this.muted) return;
    this.playBeep(330, 0.06, 'triangle', 0.08);
    setTimeout(() => this.playBeep(495, 0.06, 'triangle', 0.08), 60);
    setTimeout(() => this.playBeep(660, 0.12, 'square', 0.09), 120);
  }

  pulse() {
    if (this.muted) return;
    this.playBeep(880, 0.04, 'sine', 0.04);
  }

  simulationStep() {
    if (this.muted) return;
    this.playBeep(587.33, 0.08, 'sawtooth', 0.06);
    setTimeout(() => this.playBeep(880, 0.1, 'square', 0.07), 70);
  }

  openModal() {
    if (this.muted) return;
    this.playBeep(392, 0.05, 'triangle', 0.06);
    setTimeout(() => this.playBeep(523.25, 0.08, 'triangle', 0.07), 50);
    setTimeout(() => this.playBeep(784, 0.12, 'square', 0.08), 100);
  }

  closeModal() {
    if (this.muted) return;
    this.playBeep(659.25, 0.05, 'triangle', 0.06);
    setTimeout(() => this.playBeep(440, 0.08, 'triangle', 0.05), 50);
  }
}

const sfx = new SoundFx();

  /**
 * City layout grid definition for 2.5D Isometric Salesforce Org Visualizer.
 * 28x28 isometric grid with thematic districts, roads, waterways, and conduits.
 */

const GRID_SIZE = 28;
const TILE_WIDTH = 64;
const TILE_HEIGHT = 32;

// Tile types:
// 0: Grass / Cyber Turf
// 1: Paved Road
// 2: Glowing Fiber-Optic Data Highway
// 3: Water (Data Lake Reservoir)
// 4: Building Foundation / Concrete Pad
// 5: Tech Plaza / Stone Cobble
// 6: Maglev Transit Track

function generateTileMap() {
  const map = [];
  for (let y = 0; y < GRID_SIZE; y++) {
    const row = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      // Default ground
      let type = 0;

      // Data Lake reservoir in North-East (x >= 18 and y <= 8)
      if (x >= 18 && y <= 6) {
        type = 3;
      }

      // Main East-West Highway (y = 10, y = 11)
      if (y === 10 || y === 11) {
        type = (x % 2 === 0) ? 2 : 1;
      }

      // Main North-South Highway (x = 10, x = 11)
      if (x === 10 || x === 11) {
        type = (y % 2 === 0) ? 2 : 1;
      }

      // Secondary roads
      if (y === 5 || y === 18) {
        if (type !== 3) type = 1;
      }
      if (x === 5 || x === 18) {
        if (type !== 3) type = 1;
      }

      // Maglev Track to MCP Interchange (South-East loop)
      if ((x >= 15 && y >= 17) && (x === 15 || y === 17 || x === 24 || y === 24)) {
        type = 6;
      }

      // Central Agentforce Plaza (x: 10-15, y: 10-15)
      if (x >= 11 && x <= 14 && y >= 11 && y <= 14) {
        type = 5;
      }

      row.push(type);
    }
    map.push(row);
  }
  return map;
}

const DRONE_PATHS = [
  // Kaveri Autonomous Drone: Semantic Harbor -> Agentforce Core -> Headless 360
  [
    { x: 19, y: 4 },
    { x: 18, y: 8 },
    { x: 13, y: 12 },
    { x: 6, y: 18 },
    { x: 3, y: 15 },
    { x: 13, y: 12 }
  ],
  // Claudeforce Co-Pilot Drone: Claudeforce Lab -> Apex Foundry -> Metadata Citadel

        segmentIndex: 0,
        progress: Math.random(),
        speed: 0.006 + Math.random() * 0.003,
        currentX: path[0].x,
        currentY: path[0].y,
        altitude: 40 + i * 15
      });
    });
  }

  spawnPacket(fromBuilding, toBuilding, color = '#38bdf8', speed = 0.015) {
    if (!fromBuilding || !toBuilding) return;
    this.packets.push({
      fromX: fromBuilding.gridX + fromBuilding.width / 2,
      fromY: fromBuilding.gridY + fromBuilding.height / 2,
      toX: toBuilding.gridX + toBuilding.width / 2,
      toY: toBuilding.gridY + toBuilding.height / 2,
      progress: 0,
      speed: speed,
      color: color,
      size: 4
    });
  }

  update(delta = 16) {
    // Update radar & pulses
    this.radarAngle = (this.radarAngle + 0.04) % (Math.PI * 2);
    this.pulsePhase = (this.pulsePhase + 0.05) % (Math.PI * 2);

    // Update data packets
    for (let i = this.packets.length - 1; i >= 0; i--) {
      const p = this.packets[i];
      p.progress += p.speed;
      if (p.progress >= 1) {
        this.packets.splice(i, 1);
      }
    }

    // Auto-replenish ambient packets if low
    if (this.packets.length < 8 && Math.random() < 0.06) {
      this.spawnAmbientPacket();
    }

    // Update drones
    this.drones.forEach(d => {
      d.progress += d.speed;
      if (d.progress >= 1) {
        d.progress = 0;
        d.segmentIndex = (d.segmentIndex + 1) % d.path.length;
      }
      const p1 = d.path[d.segmentIndex];
      const p2 = d.path[(d.segmentIndex + 1) % d.path.length];
      d.currentX = p1.x + (p2.x - p1.x) * d.progress;
      d.currentY = p1.y + (p2.y - p1.y) * d.progress;
    });

    // Update smoke puffs
    if (Math.random() < 0.08) {
      // Spawn puff from Custom Objects Works (grid: 2, 7)
      this.smokePuffs.push({
        x: 3.0,
        y: 8.0,
        heightOffset: 45,
        radius: 3,
        alpha: 0.7,
        vx: (Math.random() - 0.5) * 0.005,
        vy: -0.01,
        vz: 0.4
      });
    }

    for (let i = this.smokePuffs.length - 1; i >= 0; i--) {
      const sp = this.smokePuffs[i];
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.heightOffset += sp.vz;
      sp.radius += 0.08;
      sp.alpha -= 0.008;
      if (sp.alpha <= 0) {
        this.smokePuffs.splice(i, 1);
      }
    }
  }

  setBuildings(buildings) {
    this.buildings = buildings;
  }

  spawnAmbientPacket() {
    if (!this.buildings || this.buildings.length < 2) return;
    const b1 = this.buildings[Math.floor(Math.random() * this.buildings.length)];
    if (b1.relationships && b1.relationships.length > 0) {
      const targetId = b1.relationships[Math.floor(Math.random() * b1.relationships.length)];
      const b2 = this.buildings.find(b => b.id === targetId);
      if (b2) {
        this.spawnPacket(b1, b2, b1.color || '#38bdf8', 0.012 + Math.random() * 0.008);
      }
    }
  }
}

  


class IsometricCanvas {
  constructor(canvas, catalog, particleSystem) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.catalog = catalog;
    this.particleSystem = particleSystem;
    this.particleSystem.setBuildings(catalog.buildings);

    this.tileMap = generateTileMap();
    this.buildings = catalog.buildings;
    this.conduits = catalog.conduits;

    // Camera state with smooth lerping
    this.camera = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      zoom: 1.0,
      targetZoom: 1.0,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0,
      camStartX: 0,
      camStartY: 0
    };

    // View modes: 'rendered' (axonometric model), 'wireframe' (structural blueprint)
    this.viewMode = 'rendered';
    this.hoveredBuilding = null;
    this.selectedBuilding = null;
    this.activeFilter = 'all';
    this.showCallouts = true;

    this.initCanvasSize();
    this.centerCamera(true);
    this.bindEvents();
  }

  initCanvasSize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    const w = rect.width > 50 ? rect.width : (window.innerWidth || 1200);
    const h = rect.height > 50 ? rect.height : (window.innerHeight || 800);
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.scale(dpr, dpr);
    this.width = w;
    this.height = h;
  }

  centerCamera(immediate = false) {
    const centerScreen = this.gridToScreen(13, 13);
    const targetX = this.width / 2 - centerScreen.x * this.camera.targetZoom;
    const targetY = this.height / 2 - (centerScreen.y - 100) * this.camera.targetZoom;

    this.camera.targetX = targetX;
    this.camera.targetY = targetY;

    if (immediate) {
      this.camera.x = targetX;
      this.camera.y = targetY;
      this.camera.zoom = this.camera.targetZoom;
    }
  }

  focusBuilding(buildingId) {
    const b = this.buildings.find(item => item.id === buildingId);
    if (!b) return;
    this.selectedBuilding = b;
    const pos = this.gridToScreen(b.gridX + b.width / 2, b.gridY + b.height / 2);
    this.camera.targetX = this.width / 2 - pos.x * this.camera.targetZoom;
    this.camera.targetY = this.height / 2 - (pos.y - b.floors * 1.5) * this.camera.targetZoom;
    sfx.buildingSelect();
  }

  gridToScreen(gx, gy) {
    return {
      x: (gx - gy) * (TILE_WIDTH / 2),
      y: (gx + gy) * (TILE_HEIGHT / 2)
    };
  }

  screenToGrid(sx, sy) {
    const worldX = (sx - this.camera.x) / this.camera.zoom;
    const worldY = (sy - this.camera.y) / this.camera.zoom;
    const gx = (worldX / (TILE_WIDTH / 2) + worldY / (TILE_HEIGHT / 2)) / 2;
    const gy = (worldY / (TILE_HEIGHT / 2) - worldX / (TILE_WIDTH / 2)) / 2;
    return { gx, gy };
  }

  bindEvents() {
    window.addEventListener('resize', () => this.initCanvasSize());

    this.canvas.addEventListener('mousedown', (e) => {
      this.camera.isDragging = true;
      this.camera.dragStartX = e.clientX;
      this.camera.dragStartY = e.clientY;
      this.camera.camStartX = this.camera.x;
      this.camera.camStartY = this.camera.y;
    });

    window.addEventListener('mousemove', (e) => {
      if (this.camera.isDragging) {
        const dx = e.clientX - this.camera.dragStartX;
        const dy = e.clientY - this.camera.dragStartY;
        this.camera.x = this.camera.camStartX + dx;
        this.camera.y = this.camera.camStartY + dy;
        this.camera.targetX = this.camera.x;
        this.camera.targetY = this.camera.y;
      } else {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        this.checkHover(mx, my);
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (this.camera.isDragging) {
        const dist = Math.hypot(e.clientX - this.camera.dragStartX, e.clientY - this.camera.dragStartY);
        this.camera.isDragging = false;
        if (dist < 5) {
          const rect = this.canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          this.handleClick(mx, my);
        }
      }
    });

    this.canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.14 : 0.88;
      const newZoom = Math.max(0.4, Math.min(2.5, this.camera.targetZoom * zoomFactor));

      const rect = this.canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      this.camera.targetX = mx - (mx - this.camera.x) * (newZoom / this.camera.zoom);
      this.camera.targetY = my - (my - this.camera.y) * (newZoom / this.camera.zoom);
      this.camera.targetZoom = newZoom;
    }, { passive: false });
  }

  checkHover(mx, my) {
    let found = null;
    const sorted = [...this.buildings].sort((a, b) => {
      return (b.gridX + b.width + b.gridY + b.height) - (a.gridX + a.width + a.gridY + a.height);
    });

    for (const b of sorted) {
      const p = this.gridToScreen(b.gridX + b.width / 2, b.gridY + b.height / 2);
      const sx = this.camera.x + p.x * this.camera.zoom;
      const sy = this.camera.y + (p.y - b.floors * 1.5) * this.camera.zoom;
      const bW = (b.width * TILE_WIDTH) * this.camera.zoom * 0.95;
      const bH = (b.height * TILE_HEIGHT + b.floors * 3.0) * this.camera.zoom;

      if (mx >= sx - bW / 2 && mx <= sx + bW / 2 && my >= sy - bH * 0.4 && my <= sy + bH * 0.7) {
        found = b;
        break;
      }
    }

    if (found !== this.hoveredBuilding) {
      this.hoveredBuilding = found;
      this.canvas.style.cursor = found ? 'pointer' : 'grab';
      if (found) sfx.click();
    }
  }

  handleClick(mx, my) {
    if (this.hoveredBuilding) {
      this.selectedBuilding = this.hoveredBuilding;
      sfx.buildingSelect();
      if (this.onBuildingSelected) {
        this.onBuildingSelected(this.hoveredBuilding);
      }
    }
  }

  update(delta) {
    this.camera.x += (this.camera.targetX - this.camera.x) * 0.14;
    this.camera.y += (this.camera.targetY - this.camera.y) * 0.14;
    this.camera.zoom += (this.camera.targetZoom - this.camera.zoom) * 0.14;
  }

  render(timestamp = 0) {
    const ctx = this.ctx;
    this.update(16);

    // Architectural drafting board background
    ctx.fillStyle = '#060911';
    ctx.fillRect(0, 0, this.width, this.height);

    ctx.save();
    ctx.translate(this.camera.x, this.camera.y);
    ctx.scale(this.camera.zoom, this.camera.zoom);

    // 1. Architectural Masterplan Ground Grid
    this.renderMasterplanGrid(ctx, timestamp);

    // 2. Circulation Arterials & Data Conduits
    this.renderCirculationConduits(ctx, timestamp);

    // 3. Axonometric Architectural Masses (Depth-Sorted)
    this.renderArchitecturalMasses(ctx, timestamp);

    // 4. Dynamic Data Vectors & Autonomous Drone Particles
    this.renderParticlesAndDrones(ctx, timestamp);

    // 5. Architectural Callout Annotations with Leader Lines
    if (this.showCallouts) {
      this.renderArchitecturalCallouts(ctx, timestamp);
    }

    ctx.restore();

    // 6. Active Building Floating Spec Badge (Screen-space)
    if (this.hoveredBuilding) {
      this.renderHoverSpecBadge(ctx, this.hoveredBuilding);
    }
  }

  renderMasterplanGrid(ctx, timestamp) {
    // Draw subtle isometric ground datum lines
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const type = this.tileMap[y][x];
        const { x: sx, y: sy } = this.gridToScreen(x, y);

        // Viewport culling
        const screenPx = this.camera.x + sx * this.camera.zoom;
        const screenPy = this.camera.y + sy * this.camera.zoom;
        if (screenPx < -120 || screenPx > this.width + 120 || screenPy < -120 || screenPy > this.height + 120) {
          continue;
        }

        ctx.save();
        ctx.translate(sx, sy);

        ctx.beginPath();
        ctx.moveTo(0, -TILE_HEIGHT / 2);
        ctx.lineTo(TILE_WIDTH / 2, 0);
        ctx.lineTo(0, TILE_HEIGHT / 2);
        ctx.lineTo(-TILE_WIDTH / 2, 0);
        ctx.closePath();

        if (type === 3) {
          // Data Lake Reservoir (Semantic Harbor)
          const wave = Math.sin(timestamp * 0.0025 + (x + y) * 0.5) * 6;
          ctx.fillStyle = `rgba(6, 182, 212, ${0.12 + wave * 0.005})`;
          ctx.fill();
          ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
          ctx.lineWidth = 0.75;
          ctx.stroke();

          // Delicate contour hatching
          if ((x + y) % 2 === 0) {
            ctx.beginPath();
            ctx.moveTo(-12, 0);
            ctx.lineTo(12, 0);
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.2)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        } else if (type === 1 || type === 2) {
          // Primary Circulation Highway
          ctx.fillStyle = type === 2 ? 'rgba(15, 23, 42, 0.95)' : 'rgba(10, 16, 30, 0.8)';
          ctx.fill();
          ctx.strokeStyle = type === 2 ? 'rgba(56, 189, 248, 0.5)' : 'rgba(255, 255, 255, 0.1)';
          ctx.lineWidth = type === 2 ? 1.2 : 0.6;
          ctx.stroke();

          if (type === 2) {
            // Centerline dashed datum line
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(10, 0);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        } else if (type === 5) {
          // Central Agentforce Forum / Tech Plaza
          ctx.fillStyle = 'rgba(99, 102, 241, 0.12)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(168, 85, 247, 0.45)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        } else if (type === 6) {
          // Maglev Transit Corridor
          ctx.fillStyle = 'rgba(236, 72, 153, 0.1)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(236, 72, 153, 0.5)';
          ctx.lineWidth = 1;
          ctx.stroke();
        } else {
          // Standard Urban Datum Lot
          ctx.fillStyle = 'rgba(12, 18, 32, 0.4)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }

        ctx.restore();
      }
    }
  }

  renderCirculationConduits(ctx, timestamp) {
    ctx.save();
    this.conduits.forEach(conduit => {
      const b1 = this.buildings.find(b => b.id === conduit.from);
      const b2 = this.buildings.find(b => b.id === conduit.to);
      if (!b1 || !b2) return;

      const p1 = this.gridToScreen(b1.gridX + b1.width / 2, b1.gridY + b1.height / 2);
      const p2 = this.gridToScreen(b2.gridX + b2.width / 2, b2.gridY + b2.height / 2);

      let strokeColor = 'rgba(56, 189, 248, 0.4)';
      if (conduit.type === 'automation') strokeColor = 'rgba(245, 158, 11, 0.5)';
      if (conduit.type === 'semantic') strokeColor = 'rgba(6, 182, 212, 0.5)';
      if (conduit.type === 'agentforce') strokeColor = 'rgba(168, 85, 247, 0.55)';
      if (conduit.type === 'claudeforce') strokeColor = 'rgba(249, 115, 22, 0.55)';
      if (conduit.type === 'mcp') strokeColor = 'rgba(236, 72, 153, 0.55)';
      if (conduit.type === 'headless') strokeColor = 'rgba(16, 185, 129, 0.55)';

      if (this.activeFilter !== 'all' && this.activeFilter !== conduit.type) {
        strokeColor = 'rgba(255, 255, 255, 0.04)';
      }

      // Architectural Schematic Line with Arrow Terminals
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Traveling discrete datum packets
      ctx.setLineDash([4, 14]);
      ctx.lineDashOffset = -timestamp * 0.035;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
    });
    ctx.restore();
  }

  renderArchitecturalMasses(ctx, timestamp) {
    const sorted = [...this.buildings].sort((a, b) => {
      const depthA = (a.gridX + a.width) + (a.gridY + a.height);
      const depthB = (b.gridX + b.width) + (b.gridY + b.height);
      return depthA - depthB;
    });

    sorted.forEach(b => {
      this.renderSingleAxonometricBuilding(ctx, b, timestamp);
    });
  }

  renderSingleAxonometricBuilding(ctx, b, timestamp) {
    const { x: sx, y: sy } = this.gridToScreen(b.gridX, b.gridY);
    const widthPx = b.width * (TILE_WIDTH / 2);
    const heightPx = b.height * (TILE_HEIGHT / 2);
    const massHeight = b.floors * 3.2;

    const isHovered = this.hoveredBuilding && this.hoveredBuilding.id === b.id;
    const isSelected = this.selectedBuilding && this.selectedBuilding.id === b.id;
    const isDimmed = this.activeFilter !== 'all' && this.activeFilter !== b.districtId;

    ctx.save();
    ctx.translate(sx, sy);

    if (isDimmed) {
      ctx.globalAlpha = 0.18;
    }

    // 1. Precise Axonometric Drop Shadow (Architectural Hatching)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.beginPath();
    ctx.moveTo(0, heightPx * 0.5);
    ctx.lineTo(widthPx * 1.6, heightPx * 1.8);
    ctx.lineTo(widthPx * 0.8, heightPx * 2.3);
    ctx.lineTo(-widthPx * 0.3, heightPx * 1.2);
    ctx.closePath();
    ctx.fill();

    // 2. Concrete Structural Plinth (Base Podium)
    ctx.fillStyle = '#0a0f1d';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-widthPx, heightPx);
    ctx.lineTo(0, heightPx * 2);
    ctx.lineTo(widthPx, heightPx);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 3. Facade Tones & Architectural Glazing
    const baseAccent = b.color || '#38bdf8';
    const leftFacade = 'rgba(16, 24, 42, 0.95)';
    const rightFacade = 'rgba(10, 15, 28, 0.98)';
    const roofSlab = 'rgba(26, 38, 64, 0.92)';

    // Left Elevation Face
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-widthPx, heightPx);
    ctx.lineTo(-widthPx, heightPx - massHeight);
    ctx.lineTo(0, -massHeight);
    ctx.closePath();
    ctx.fillStyle = leftFacade;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Right Elevation Face
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(widthPx, heightPx);
    ctx.lineTo(widthPx, heightPx - massHeight);
    ctx.lineTo(0, -massHeight);
    ctx.closePath();
    ctx.fillStyle = rightFacade;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 4. Architectural Floor Slabs & Vertical Mullions
    this.renderFloorPlatesAndMullions(ctx, b, widthPx, heightPx, massHeight, baseAccent, timestamp);

    // 5. Roof Floor Slab (Horizontal Datum)
    ctx.beginPath();
    ctx.moveTo(0, -massHeight);
    ctx.lineTo(-widthPx, heightPx - massHeight);
    ctx.lineTo(0, heightPx * 2 - massHeight);
    ctx.lineTo(widthPx, heightPx - massHeight);
    ctx.closePath();
    ctx.fillStyle = roofSlab;
    ctx.fill();
    ctx.strokeStyle = baseAccent;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 6. Inset Penthouse / Mechanical Crown Assembly
    const crownW = widthPx * 0.65;
    const crownH = heightPx * 0.65;
    const crownLift = massHeight + 12;

    ctx.beginPath();
    ctx.moveTo(0, -crownLift);
    ctx.lineTo(-crownW, crownH - crownLift);
    ctx.lineTo(0, crownH * 2 - crownLift);
    ctx.lineTo(crownW, crownH - crownLift);
    ctx.closePath();
    ctx.fillStyle = baseAccent;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 7. Rooftop Architectural Focal Element
    this.renderArchitecturalCrown(ctx, b, widthPx, heightPx, crownLift, timestamp);

    // 8. Architectural Hover / Active Selection Boundary
    if (isHovered || isSelected) {
      // Crisp neon wireframe bounding contour
      ctx.lineWidth = isSelected ? 2.5 : 1.75;
      ctx.strokeStyle = isSelected ? '#facc15' : varAccent(b.districtId);
      ctx.stroke();

      // Footprint datum frame
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.lineTo(-widthPx - 4, heightPx);
      ctx.lineTo(0, heightPx * 2 + 4);
      ctx.lineTo(widthPx + 4, heightPx);
      ctx.closePath();
      ctx.strokeStyle = isSelected ? '#facc15' : 'rgba(0, 240, 255, 0.8)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.restore();
  }

  renderFloorPlatesAndMullions(ctx, b, w, h, bh, accent, timestamp) {
    const floorLevels = Math.min(12, Math.floor(b.floors / 3.8));
    const bays = 3;

    // Horizontal Floor Slab Linework
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 0.75;

    for (let f = 1; f <= floorLevels; f++) {
      const yL = (bh / (floorLevels + 1)) * f;

      // Left face floor slab
      ctx.beginPath();
      ctx.moveTo(0, -yL);
      ctx.lineTo(-w, h - yL);
      ctx.stroke();

      // Right face floor slab
      ctx.beginPath();
      ctx.moveTo(0, -yL);
      ctx.lineTo(w, h - yL);
      ctx.stroke();

      // Subtle architectural interior office glow
      for (let c = 1; c <= bays; c++) {
        const isLit = Math.sin(timestamp * 0.0012 + f * 7 + c * 3 + b.floors) > -0.15;
        if (isLit) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          const wx = -w * (c / (bays + 1));
          const wy = h * (c / (bays + 1)) - yL;
          ctx.fillRect(wx - 2, wy - 3, 3, 5);

          const rx = w * (c / (bays + 1));
          const ry = h * (c / (bays + 1)) - yL;
          ctx.fillStyle = accent;
          ctx.fillRect(rx - 1, ry - 3, 3, 5);
        }
      }
    }

    // Vertical Mullion Columns
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 0.5;
    for (let c = 1; c <= bays; c++) {
      const ratio = c / (bays + 1);
      ctx.beginPath();
      ctx.moveTo(-w * ratio, h * ratio);
      ctx.lineTo(-w * ratio, h * ratio - bh);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(w * ratio, h * ratio);
      ctx.lineTo(w * ratio, h * ratio - bh);
      ctx.stroke();
    }
  }

  renderArchitecturalCrown(ctx, b, w, h, lift, timestamp) {
    const cx = 0;
    const cy = h * 0.65 - lift;

    if (b.roofType === 'pulsing_orb') {
      // Agentforce Atlas Spire: Suspended Polyhedral Energy Core
      const pulse = Math.sin(timestamp * 0.004) * 6;
      const gradient = ctx.createRadialGradient(cx, cy - 26, 2, cx, cy - 26, 26 + pulse);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.35, '#c084fc');
      gradient.addColorStop(0.7, 'rgba(168, 85, 247, 0.35)');
      gradient.addColorStop(1, 'transparent');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(cx, cy - 26, 26 + pulse, 0, Math.PI * 2);
      ctx.fill();

      // Octahedral Core
      ctx.fillStyle = '#9333ea';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 36);
      ctx.lineTo(cx + 8, cy - 26);
      ctx.lineTo(cx, cy - 16);
      ctx.lineTo(cx - 8, cy - 26);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#f3e8ff';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Gyroscopic Orbital Gimbal Rings
      ctx.beginPath();
      ctx.ellipse(cx, cy - 26, 20, 8, timestamp * 0.002, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.7)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    } else if (b.roofType === 'beacon') {
      // Calculated Insights Lighthouse: Dynamic 3D Axonometric Light Cone
      const angle = timestamp * 0.0028;
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.arc(cx, cy - 14, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy - 14);
      ctx.arc(cx, cy - 14, 160, angle - 0.25, angle + 0.25);
      ctx.closePath();
      ctx.fillStyle = 'rgba(6, 182, 212, 0.18)';
      ctx.fill();
      ctx.restore();
    } else if (b.roofType === 'rotating_dome' || b.roofType === 'radar') {
      // Claudeforce Geodesic Observatory Dome
      ctx.beginPath();
      ctx.arc(cx, cy - 10, 11, 0, Math.PI, true);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Radar Azimuth Pointer
      const angle = timestamp * 0.035;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 10);
      ctx.lineTo(cx + Math.cos(angle) * 18, cy - 10 + Math.sin(angle) * 9);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (b.roofType === 'antenna') {
      // Structural Communications Mast with Ruby Strobe
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy - 36);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      const strobe = Math.sin(timestamp * 0.007) > 0.3;
      ctx.fillStyle = strobe ? '#ff453a' : '#450a0a';
      ctx.beginPath();
      ctx.arc(cx, cy - 36, 3.5, 0, Math.PI * 2);
      ctx.fill();
      if (strobe) {
        ctx.strokeStyle = 'rgba(255, 69, 58, 0.6)';
        ctx.stroke();
      }
    } else if (b.roofType === 'helipad') {
      // Headless Skyport Cantilevered Aerospace Deck
      ctx.fillStyle = '#064e3b';
      ctx.beginPath();
      ctx.arc(cx, cy, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 11px JetBrains Mono, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('HXL', cx, cy);
    } else if (b.roofType === 'crystal') {
      // Vector RAG Knowledge Monolith
      const bob = Math.sin(timestamp * 0.004) * 5;
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 30 + bob);
      ctx.lineTo(cx + 8, cy - 16 + bob);
      ctx.lineTo(cx, cy - 2 + bob);
      ctx.lineTo(cx - 8, cy - 16 + bob);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  renderParticlesAndDrones(ctx, timestamp) {
    // 1. Ingestion / Action Data Packets
    this.particleSystem.packets.forEach(p => {
      const curX = p.fromX + (p.toX - p.fromX) * p.progress;
      const curY = p.fromY + (p.toY - p.fromY) * p.progress;
      const pos = this.gridToScreen(curX, curY);
      const arc = Math.sin(p.progress * Math.PI) * 28;

      ctx.save();
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y - arc, p.size || 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // 2. Autonomous Coworker Drones (Spatial Waypoint Flight)
    this.particleSystem.drones.forEach((d, i) => {
      const pos = this.gridToScreen(d.currentX, d.currentY);
      const bob = Math.sin(timestamp * 0.005 + i) * 3;
      const altitudeY = pos.y - d.altitude + bob;

      ctx.save();
      // Drop Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, 8, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Drone Chassis
      ctx.fillStyle = d.color;
      ctx.fillRect(pos.x - 5, altitudeY - 3, 10, 5);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 0.8;
      ctx.strokeRect(pos.x - 5, altitudeY - 3, 10, 5);

      // Rotors
      const angle = timestamp * 0.07;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(pos.x - 10 + Math.cos(angle) * 5, altitudeY - 5);
      ctx.lineTo(pos.x - 10 - Math.cos(angle) * 5, altitudeY - 5);
      ctx.moveTo(pos.x + 10 + Math.cos(angle) * 5, altitudeY - 5);
      ctx.lineTo(pos.x + 10 - Math.cos(angle) * 5, altitudeY - 5);
      ctx.stroke();

      ctx.restore();
    });
  }

  renderArchitecturalCallouts(ctx, timestamp) {
    // Elegant architectural leader-line callouts anchored to signature landmarks
    const landmarks = [
      { id: 'b_standard_objects', label: 'METADATA SCHEMA CITADEL', sub: 'Standard & Custom SObjects', color: '#38bdf8', dir: -1 },
      { id: 'b_agentforce_core', label: 'ATLAS REASONING ENGINE', sub: 'Autonomous Cognitive Spire', color: '#a855f7', dir: 1 },
      { id: 'b_data_lake', label: 'DATA CLOUD RESERVOIR', sub: 'Unified Context Graph (DLO/DMO)', color: '#06b6d4', dir: 1 },
      { id: 'b_headless_gateway', label: 'HEADLESS 360 SKYPORT', sub: 'The API is the UI // HXL', color: '#10b981', dir: -1 },
      { id: 'b_mcp_context', label: 'DUAL-PLANE MCP TERMINAL', sub: 'Model Context Protocol Hub', color: '#ec4899', dir: 1 }
    ];

    ctx.save();
    landmarks.forEach(lm => {
      const b = this.buildings.find(item => item.id === lm.id);
      if (!b) return;

      const pos = this.gridToScreen(b.gridX + b.width / 2, b.gridY + b.height / 2);
      const anchorY = pos.y - b.floors * 3.2 - 25;
      const offsetLength = 40 * lm.dir;
      const labelX = pos.x + offsetLength;
      const labelY = anchorY - 30;

      // Leader line with node circle
      ctx.beginPath();
      ctx.arc(pos.x, anchorY, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = lm.color;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(pos.x, anchorY);
      ctx.lineTo(pos.x + offsetLength * 0.4, labelY);
      ctx.lineTo(labelX, labelY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Typographic callout text
      ctx.font = '700 9px JetBrains Mono, monospace';
      ctx.fillStyle = lm.color;
      ctx.textAlign = lm.dir > 0 ? 'left' : 'right';
      ctx.fillText(lm.label, labelX + (lm.dir > 0 ? 6 : -6), labelY - 3);

      ctx.font = '500 8.5px Plus Jakarta Sans, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fillText(lm.sub, labelX + (lm.dir > 0 ? 6 : -6), labelY + 9);
    });
    ctx.restore();
  }

  renderHoverSpecBadge(ctx, b) {
    const pos = this.gridToScreen(b.gridX + b.width / 2, b.gridY + b.height / 2);
    const sx = this.camera.x + pos.x * this.camera.zoom;
    const sy = this.camera.y + (pos.y - b.floors * 3.2 - 35) * this.camera.zoom;

    ctx.save();
    ctx.font = '600 12px Plus Jakarta Sans, sans-serif';
    const textWidth = ctx.measureText(b.name).width;

    const padX = 14;
    const padY = 8;
    const w = textWidth + padX * 2;
    const h = 32;

    ctx.fillStyle = 'rgba(10, 15, 26, 0.94)';
    ctx.strokeStyle = b.color || '#38bdf8';
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.roundRect(sx - w / 2, sy - h / 2, w, h, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.name, sx, sy);
    ctx.restore();
  }
}

function varAccent(districtId) {
  if (districtId === 'metadata') return '#38bdf8';

  if (districtId === 'semantic') return '#06b6d4';
  if (districtId === 'headless') return '#10b981';
  if (districtId === 'agentforce') return '#a855f7';
  if (districtId === 'claudeforce') return '#f97316';
  if (districtId === 'mcp') return '#ec4899';
  return '#ffffff';
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

      { id: 'b_apex_foundry', title: 'INDRA_UnifiedContextService.cls (Apex)', subtitle: 'Invocable Apex executed WITH USER_MODE', category: 'LOGIC & AUTOMATION', icon: '⚡', color: '#f59e0b' },
      { id: 'b_data_refinery', title: 'UnifiedIndividual__dlm (Data Cloud DMO)', subtitle: 'Deterministic & probabilistic Golden Record entity', category: 'SEMANTIC GRAPH', icon: '🌊', color: '#06b6d4' },
      { id: 'b_calculated_insights', title: 'Care_Risk_Score__cio (Calculated Insight)', subtitle: 'Continuous SQL aggregations over streaming lakes', category: 'SEMANTIC GRAPH', icon: '🌊', color: '#06b6d4' },
      { id: 'b_mcp_action', title: 'headless360_dispatch (MCP Tool)', subtitle: 'Plane 2 Action dispatcher enforcing user context', category: 'MCP TOOLS', icon: '🔌', color: '#ec4899' }
    ];

    schemas.forEach(s => {
      this.allItems.push({
        type: 'building',
        category: s.category,
        id: s.id,
        title: s.title,
        subtitle: s.subtitle,
        tags: ['schema', 'code', 'metadata'],
        color: s.color,
        icon: s.icon
      });
    });
  }

  bindGlobalKeys() {
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        this.toggle();
      } else if (e.key === 'Escape' && this.isOpen) {
        this.close();
      }
    });
  }

  toggle() {
    if (this.isOpen) {
      this.close();
    } else {
      this.open();
    }
  }

  open() {
    this.isOpen = true;
    this.selectedIndex = 0;
    this.container.classList.remove('hidden');
    this.render();
    sfx.openModal();

    setTimeout(() => {
      const input = this.container.querySelector('#command-search-input');
      if (input) input.focus();
    }, 50);
  }

  close() {
    this.isOpen = false;
    this.container.classList.add('hidden');
    sfx.closeModal();
  }

  filter(query) {
    const q = query.toLowerCase().trim();
    if (!q) {
      this.filteredItems = this.allItems.slice(0, 8);
    } else {
      this.filteredItems = this.allItems.filter(item => {
        const titleMatch = item.title.toLowerCase().includes(q);
        const subMatch = item.subtitle.toLowerCase().includes(q);
        const tagMatch = item.tags && item.tags.some(t => t.toLowerCase().includes(q));
        const catMatch = item.category.toLowerCase().includes(q);
        return titleMatch || subMatch || tagMatch || catMatch;
      });
    }
    this.selectedIndex = Math.min(this.selectedIndex, Math.max(0, this.filteredItems.length - 1));
    this.renderList();
  }

  selectItem(index) {
    const item = this.filteredItems[index];
    if (!item) return;

    this.close();
    sfx.click();

    if (item.type === 'building') {
      if (this.onSelectBuilding) {
        this.onSelectBuilding(item.id);
      }
    } else if (item.type === 'concept') {
      if (this.onSelectConcept) {
        this.onSelectConcept(item.id);
      }
    }
  }

  render() {
    this.container.innerHTML = `
      <div class="modal-overlay" style="align-items: flex-start; padding-top: 12vh;">
        <div class="palette-window" style="width: 100%; max-width: 640px; background: rgba(10, 15, 26, 0.96); backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 240, 255, 0.2); overflow: hidden; display: flex; flex-direction: column;">
          
          <!-- Search Input Header -->
          <div style="padding: 14px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 12px; background: rgba(5, 8, 16, 0.6);">
            <span style="font-size: 16px; color: #38bdf8;">🔍</span>
            <input id="command-search-input" type="text" placeholder="Search SObjects, Flows, DMOs, Apex, or Concepts (e.g. Atlas, Golden Record, MCP)..." 
              style="flex: 1; background: transparent; border: none; outline: none; font-size: 13.5px; font-family: var(--font-sans); color: #ffffff; caret-color: #00f0ff;" />
            <span class="datum-tag" style="font-size: 9.5px; font-family: 'JetBrains Mono', monospace;">ESC TO EXIT</span>
          </div>

          <!-- Results List Container -->
          <div id="palette-results" style="max-height: 380px; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column;">
            <!-- Populated dynamically -->
          </div>

          <!-- Footer Tips -->
          <div style="padding: 10px 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(5, 8, 16, 0.8); display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #64748b; font-family: 'JetBrains Mono', monospace;">
            <span>↑ ↓ TO NAVIGATE</span>
            <span>↵ TO SELECT & FLY CAMERA</span>
          </div>
        </div>
      </div>
    `;

    const input = this.container.querySelector('#command-search-input');
    input.addEventListener('input', (e) => this.filter(e.target.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        this.selectedIndex = (this.selectedIndex + 1) % Math.max(1, this.filteredItems.length);
        this.renderList();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        this.selectedIndex = (this.selectedIndex - 1 + this.filteredItems.length) % Math.max(1, this.filteredItems.length);
        this.renderList();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        this.selectItem(this.selectedIndex);
      }
    });

    this.container.querySelector('.modal-overlay').addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        this.close();
      }
    });

    this.filter('');
  }

  renderList() {
    const listEl = this.container.querySelector('#palette-results');
    if (!listEl) return;

    if (this.filteredItems.length === 0) {
      listEl.innerHTML = `
        <div style="padding: 24px; text-align: center; color: #64748b; font-size: 12px; font-family: 'JetBrains Mono', monospace;">
          No matching architectural nodes or concepts found.
        </div>
      `;
      return;
    }

    listEl.innerHTML = this.filteredItems.map((item, idx) => {
      const isSelected = idx === this.selectedIndex;
      return `
        <div class="palette-item" data-index="${idx}" style="padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.1s; background: ${isSelected ? 'rgba(56, 189, 248, 0.12)' : 'transparent'}; border-left: 3px solid ${isSelected ? item.color : 'transparent'};">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 30px; height: 30px; border-radius: 6px; background: ${item.color}15; border: 1px solid ${item.color}44; display: flex; align-items: center; justify-content: center; font-size: 14px;">
              ${item.icon}
            </div>
            <div>
              <div style="font-size: 13px; font-weight: 600; color: ${isSelected ? '#ffffff' : '#cbd5e1'};">
                ${item.title}
              </div>
              <div style="font-size: 11px; color: #94a3b8;">
                ${item.subtitle}
              </div>
            </div>
          </div>
          <span class="datum-tag" style="font-size: 9px; color: ${item.color}; border-color: ${item.color}44;">
            ${item.category}
          </span>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.palette-item').forEach(el => {
      el.addEventListener('mouseenter', () => {
        this.selectedIndex = parseInt(el.dataset.index, 10);
        this.renderList();
      });
      el.addEventListener('click', () => {
        this.selectItem(parseInt(el.dataset.index, 10));
      });
    });

    const activeEl = listEl.querySelector(`[data-index="${this.selectedIndex}"]`);
    if (activeEl) {
      activeEl.scrollIntoView({ block: 'nearest' });
    }
  }
}

class GuidedTour {
  constructor(container, isoCanvas, onOpenConcept) {
    this.container = container;
    this.isoCanvas = isoCanvas;
    this.onOpenConcept = onOpenConcept;
    this.currentIndex = 0;
    this.isActive = false;
  }

  start(stepIndex = 0) {
    this.isActive = true;
    this.currentIndex = stepIndex;
    this.container.classList.remove('hidden');
    this.goToStop(this.currentIndex);
    sfx.openModal();
  }

  stop() {
    this.isActive = false;
    this.container.classList.add('hidden');
    this.isoCanvas.activeFilter = 'all';
    this.isoCanvas.centerCamera();
    sfx.closeModal();
  }

  next() {
    if (this.currentIndex < TOUR_STOPS.length - 1) {
      this.goToStop(this.currentIndex + 1);
    } else {
      this.stop();
    }
  }

  prev() {
    if (this.currentIndex > 0) {
      this.goToStop(this.currentIndex - 1);
    }
  }

  goToStop(index) {
    this.currentIndex = index;
    const stop = TOUR_STOPS[this.currentIndex];

    // Filter canvas and focus building
    this.isoCanvas.activeFilter = stop.districtId;
    this.isoCanvas.focusBuilding(stop.buildingId);
    sfx.simulationStep();

    this.render();
  }

  render() {
    const stop = TOUR_STOPS[this.currentIndex];
    const total = TOUR_STOPS.length;

    this.container.innerHTML = `
      <div style="position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 45; width: 92%; max-width: 720px; background: rgba(9, 14, 26, 0.96); backdrop-filter: blur(28px); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(0, 240, 255, 0.2); overflow: hidden; animation: tour-slide-up 0.25s cubic-bezier(0.16, 1, 0.3, 1);">
        
        <!-- Header Bar -->
        <div style="padding: 12px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(5, 8, 16, 0.7); display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="datum-tag" style="border-color: #00f0ff; color: #00f0ff;">
              CHAPTER ${stop.step} OF ${total}
            </span>
            <span style="font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace;">ARCHITECTURAL TOUR</span>
          </div>
          <button id="btn-exit-tour" class="action-btn-ghost" style="padding: 3px 8px; font-size: 11.5px;">
            ✕ Exit Tour
          </button>
        </div>

        <!-- Narrative Body -->
        <div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 10px;">
          <div>
            <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 700; color: #ffffff;">${stop.title}</h2>
            <div style="font-size: 11.5px; color: #38bdf8; font-family: 'JetBrains Mono', monospace;">${stop.subtitle}</div>
          </div>

          <p style="margin: 0; color: #cbd5e1; font-size: 12.5px; line-height: 1.6;">${stop.narrative}</p>

          <div style="padding: 10px 14px; border-radius: 8px; background: rgba(0, 240, 255, 0.06); border-left: 3px solid #00f0ff; font-size: 11.5px; color: #f1f5f9;">
            <strong style="color: #00f0ff;">Architectural Key:</strong> ${stop.keyTakeaway}
          </div>
        </div>

        <!-- Progress Dots & Controls -->
        <div style="padding: 12px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(5, 8, 16, 0.85); display: flex; align-items: center; justify-content: space-between;">
          <!-- Progress Dots -->
          <div style="display: flex; align-items: center; gap: 6px;">
            ${TOUR_STOPS.map((s, idx) => `
              <div style="width: ${idx === this.currentIndex ? '20px' : '6px'}; height: 6px; border-radius: 3px; background: ${idx === this.currentIndex ? '#00f0ff' : 'rgba(255, 255, 255, 0.2)'}; transition: all 0.2s;"></div>
            `).join('')}
          </div>

          <!-- Buttons -->
          <div style="display: flex; align-items: center; gap: 8px;">
            <button id="btn-tour-prev" class="action-btn-ghost" style="padding: 6px 12px; font-size: 11.5px;" ${this.currentIndex === 0 ? 'disabled style="opacity: 0.3;"' : ''}>
              ← Previous
            </button>
            <button id="btn-tour-next" class="action-btn-primary" style="padding: 6px 16px; font-size: 11.5px;">
              ${this.currentIndex === total - 1 ? 'Finish Tour ✓' : 'Next Chapter →'}
            </button>
          </div>
        </div>

      </div>
    `;

    this.container.querySelector('#btn-exit-tour').onclick = () => this.stop();
    this.container.querySelector('#btn-tour-prev').onclick = () => this.prev();
    this.container.querySelector('#btn-tour-next').onclick = () => this.next();
  }
}

    this.isPlaying = true;
    this.executeStep(0);
    this.scheduleNext();
    sfx.openModal();
  }

  stop() {
    this.isPlaying = false;
    if (this.timer) clearTimeout(this.timer);
    this.container.classList.add('hidden');
    sfx.closeModal();
  }

  togglePlay() {
    if (this.isPlaying) {
      this.pause();
    } else {
      this.play();
    }
  }

  play() {
    this.isPlaying = true;
    sfx.click();
    this.scheduleNext();
    this.render();
  }

  pause() {
    this.isPlaying = false;
    if (this.timer) clearTimeout(this.timer);
    sfx.click();
    this.render();
  }

  next() {
    if (this.currentStep < RESCUE_STAGES.length - 1) {
      this.jumpToStep(this.currentStep + 1);
    }
  }

  prev() {
    if (this.currentStep > 0) {
      this.jumpToStep(this.currentStep - 1);
    }
  }

  reset() {
    this.jumpToStep(0);
  }

  jumpToStep(index) {
    if (this.timer) clearTimeout(this.timer);
    this.currentStep = index;
    this.executeStep(index);
    if (this.isPlaying) {
      this.scheduleNext();
    } else {
      this.render();
    }
  }

  scheduleNext() {
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      if (this.isPlaying) {
        if (this.currentStep < RESCUE_STAGES.length - 1) {
          this.jumpToStep(this.currentStep + 1);
        } else {
          this.pause();
        }
      }
    }, 3800);
  }

  executeStep(index) {
    const stage = RESCUE_STAGES[index];
    if (!stage) return;

    // Focus camera on source building
    this.isoCanvas.focusBuilding(stage.buildingId);
    sfx.pulse();

    // Spawn animated data packets along conduit
    const b1 = this.isoCanvas.buildings.find(b => b.id === stage.buildingId);
    const b2 = this.isoCanvas.buildings.find(b => b.id === stage.targetBuildingId);
    if (b1 && b2) {
      this.particleSystem.spawnPacket(b1, b2, stage.conduitColor, 0.025);
    }

    this.render();
  }

  render() {
    const stage = RESCUE_STAGES[this.currentStep];
    const total = RESCUE_STAGES.length;

    this.container.innerHTML = `
      <div style="position: absolute; top: 88px; left: 50%; transform: translateX(-50%); z-index: 45; width: 94%; max-width: 860px; background: rgba(8, 12, 22, 0.96); backdrop-filter: blur(28px); border: 1px solid rgba(16, 185, 129, 0.45); border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(16, 185, 129, 0.2); overflow: hidden; animation: sim-fade 0.2s ease;">
        
        <!-- Top Operational Stage Bar -->
        <div style="padding: 12px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(5, 8, 16, 0.7); display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span class="datum-tag" style="border-color: #10b981; color: #10b981;">
              STAGE ${stage.step} OF ${total}
            </span>
            <span style="font-size: 13px; font-weight: 700; color: #ffffff;">${stage.title}</span>
          </div>

          <div style="display: flex; align-items: center; gap: 8px;">
            <button id="btn-toggle-payload" class="action-btn-primary" style="padding: 4px 10px; font-size: 11px;">
              ${this.isPayloadOpen ? 'Hide Payload' : 'Inspect JSON Payload 📄'}
            </button>
            <button id="btn-close-sim" class="action-btn-ghost" style="padding: 4px 8px; font-size: 12px;">
              ✕ Close
            </button>
          </div>
        </div>

        <!-- Interactive Stage Breadcrumb Tabs -->
        <div style="display: flex; border-bottom: 1px solid rgba(255, 255, 255, 0.06); background: rgba(5, 8, 16, 0.5); overflow-x: auto;">
          ${RESCUE_STAGES.map((s, idx) => {
            const isActive = idx === this.currentStep;
            return `
              <button class="stage-tab-btn" data-step="${idx}" style="flex: 1; padding: 8px 10px; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 600; border: none; border-bottom: 2px solid ${isActive ? '#10b981' : 'transparent'}; background: ${isActive ? 'rgba(16, 185, 129, 0.12)' : 'transparent'}; color: ${isActive ? '#10b981' : '#94a3b8'}; cursor: pointer; transition: all 0.15s; white-space: nowrap;">
                ${s.step}. ${s.action.split(' ')[0]}
              </button>
            `;
          }).join('')}
        </div>

        <!-- Stage Narrative Detail -->
        <div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;">
          <p style="margin: 0; font-size: 13px; color: #f1f5f9; line-height: 1.5;">${stage.detail}</p>

          <!-- Collapsible Payload Inspector -->
          ${this.isPayloadOpen ? `
            <div style="margin-top: 6px; padding: 14px; background: #050811; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #10b981; font-weight: 700;">LIVE TELEMETRY / PROTOCOL PAYLOAD</span>
                <span class="datum-tag">JSON-RPC / REST GRAPHQL</span>
              </div>
              <pre style="margin: 0; max-height: 180px; overflow-y: auto; font-size: 11px; color: #6ee7b7; font-family: 'JetBrains Mono', monospace;"><code>${JSON.stringify(stage.payload, null, 2)}</code></pre>
            </div>
          ` : ''}
        </div>

        <!-- Bottom Playback Controls Bar -->
        <div style="padding: 10px 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(5, 8, 16, 0.85); display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <button id="btn-sim-reset" class="action-btn-ghost" title="Reset (0)" style="padding: 5px 10px; font-size: 11.5px;">
              ⟲ Reset
            </button>
            <button id="btn-sim-prev" class="action-btn-ghost" title="Previous Step" style="padding: 5px 10px; font-size: 11.5px;" ${this.currentStep === 0 ? 'disabled style="opacity: 0.3;"' : ''}>
              ◀ Back
            </button>
            <button id="btn-sim-play" class="action-btn-primary" style="padding: 5px 14px; font-size: 11.5px; background: #059669;">
              ${this.isPlaying ? '❚❚ Pause' : '▶ Play'}
            </button>
            <button id="btn-sim-next" class="action-btn-ghost" title="Next Step" style="padding: 5px 10px; font-size: 11.5px;" ${this.currentStep === total - 1 ? 'disabled style="opacity: 0.3;"' : ''}>
              Forward ▶
            </button>
          </div>

          <div style="font-size: 11px; color: #64748b; font-family: 'JetBrains Mono', monospace;">
            SPACEBAR: PLAY/PAUSE • CLICK STAGES TO SCRUB
          </div>
        </div>

      </div>
    `;

    this.container.querySelector('#btn-close-sim').onclick = () => this.stop();
    this.container.querySelector('#btn-sim-play').onclick = () => this.togglePlay();
    this.container.querySelector('#btn-sim-next').onclick = () => this.next();
    this.container.querySelector('#btn-sim-prev').onclick = () => this.prev();
    this.container.querySelector('#btn-sim-reset').onclick = () => this.reset();

    const payloadBtn = this.container.querySelector('#btn-toggle-payload');
    if (payloadBtn) {
      payloadBtn.onclick = () => {
        this.isPayloadOpen = !this.isPayloadOpen;
        this.render();
      };
    }

    this.container.querySelectorAll('.stage-tab-btn').forEach(btn => {
      btn.onclick = () => {
        const stepIdx = parseInt(btn.dataset.step, 10);
        this.jumpToStep(stepIdx);
      };
    });
  }
}

  









document.addEventListener('DOMContentLoaded', () => {
  const canvasEl = document.getElementById('city-canvas');
  const inspectorContainer = document.getElementById('building-inspector');
  const modalContainer = document.getElementById('concept-modal');
  const paletteContainer = document.getElementById('command-palette-modal');
  const tourContainer = document.getElementById('guided-tour-container');
  const simContainer = document.getElementById('simulation-controller-container');
  const shortcutsContainer = document.getElementById('shortcuts-modal');

  const particleSystem = new ParticleSystem();
  const isoCanvas = new IsometricCanvas(canvasEl, METADATA_CATALOG, particleSystem);

  const inspector = new BuildingInspector(inspectorContainer, (building) => {
    handleBuildingAction(building, isoCanvas, particleSystem);
  });

  const conceptModal = new ConceptModal(modalContainer);

  const commandPalette = new CommandPalette(
    paletteContainer,
    METADATA_CATALOG,
    (buildingId) => {
      isoCanvas.focusBuilding(buildingId);
      const b = METADATA_CATALOG.buildings.find(item => item.id === buildingId);
      if (b) inspector.show(b);
    },
    (conceptId) => {
      conceptModal.show(conceptId);
    }
  );

  const guidedTour = new GuidedTour(tourContainer, isoCanvas, (conceptId) => {
    conceptModal.show(conceptId);
  });

  const simController = new SimulationController(simContainer, isoCanvas, particleSystem);

  // Hook building selection on canvas click
  isoCanvas.onBuildingSelected = (building) => {
    inspector.show(building);
  };

  // Wire up Program / Layer Filter segmented buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filter = btn.dataset.filter;
      isoCanvas.activeFilter = filter;
      sfx.districtSelect();
    });
  });

  // Top Action Buttons
  document.getElementById('btn-open-search').addEventListener('click', () => {
    commandPalette.open();
  });

  document.getElementById('btn-start-tour').addEventListener('click', () => {
    guidedTour.start(0);
  });

  document.getElementById('btn-open-academy').addEventListener('click', () => {
    conceptModal.show('headless360');
  });

  document.getElementById('btn-run-simulation').addEventListener('click', () => {
    simController.start();
  });

  const calloutBtn = document.getElementById('btn-toggle-callouts');
  if (calloutBtn) {
    calloutBtn.addEventListener('click', () => {
      isoCanvas.showCallouts = !isoCanvas.showCallouts;
      calloutBtn.style.color = isoCanvas.showCallouts ? '#38bdf8' : '#64748b';
      sfx.click();
    });
  }

  document.getElementById('btn-shortcuts').addEventListener('click', () => {
    toggleShortcutsModal(shortcutsContainer);
  });

  document.getElementById('btn-toggle-sound').addEventListener('click', (e) => {
    const isMuted = sfx.toggleMute();
    e.target.innerHTML = isMuted ? '🔇' : '🔊';
  });

  document.getElementById('btn-center-camera').addEventListener('click', () => {
    isoCanvas.centerCamera();
    sfx.click();
  });

  // Quick Zone Jump buttons in bottom dock
  document.querySelectorAll('.district-jump-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetBuildingId = btn.dataset.target;
      isoCanvas.focusBuilding(targetBuildingId);
      const b = METADATA_CATALOG.buildings.find(item => item.id === targetBuildingId);
      if (b) inspector.show(b);
    });
  });

  // District Quick Jump Map
  const districtJumps = {
    '1': 'b_standard_objects',
    '2': 'b_apex_foundry',
    '3': 'b_data_lake',
    '4': 'b_headless_gateway',
    '5': 'b_agentforce_core',
    '6': 'b_claudeforce_lab',
    '7': 'b_mcp_context'
  };

  // Global Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    // Ignore input focus
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      if (guidedTour.isActive) {
        guidedTour.stop();
      } else {
        guidedTour.start(0);
      }
    } else if (e.key === ' ' && !simContainer.classList.contains('hidden')) {
      e.preventDefault();
      simController.togglePlay();
    } else if (e.key === '?') {
      e.preventDefault();
      toggleShortcutsModal(shortcutsContainer);
    } else if (districtJumps[e.key]) {
      const bId = districtJumps[e.key];
      isoCanvas.focusBuilding(bId);
      const b = METADATA_CATALOG.buildings.find(item => item.id === bId);
      if (b) inspector.show(b);
    } else if (e.key === 'c' || e.key === 'C') {
      isoCanvas.centerCamera();
    } else if (e.key === 'm' || e.key === 'M') {
      const isMuted = sfx.toggleMute();
      const soundBtn = document.getElementById('btn-toggle-sound');
      if (soundBtn) soundBtn.innerHTML = isMuted ? '🔇' : '🔊';
    } else if (e.key === 'Escape') {
      if (guidedTour.isActive) guidedTour.stop();
      if (!shortcutsContainer.classList.contains('hidden')) shortcutsContainer.classList.add('hidden');
      if (!modalContainer.classList.contains('hidden')) conceptModal.hide();
      if (!inspectorContainer.classList.contains('hidden')) inspector.hide();
      if (!simContainer.classList.contains('hidden')) simController.stop();
    }
  });

  // Animation Loop
  let lastTime = performance.now();
  function loop(currentTime) {
    const delta = currentTime - lastTime;
    lastTime = currentTime;

    particleSystem.update(delta);
    isoCanvas.render(currentTime);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
});

    container.classList.add('hidden');
    sfx.closeModal();
    return;
  }

  sfx.openModal();

  container.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-window" style="max-width: 580px; height: auto;">
        <div style="padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(8, 12, 22, 0.9); display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 18px;">⌨️</span>
            <span style="font-size: 14px; font-weight: 700; color: #ffffff;">Keyboard Shortcuts & Navigation</span>
          </div>
          <button id="btn-close-shortcuts" class="action-btn-ghost" style="padding: 4px 8px; font-size: 12px;">✕</button>
        </div>

        <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 12.5px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #cbd5e1;">Universal Search & Command Palette</span>
            <span class="datum-tag" style="color: #00f0ff; border-color: #00f0ff;">⌘K / Ctrl+K</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #cbd5e1;">Start / Stop Guided Architectural Tour</span>
            <span class="datum-tag" style="color: #38bdf8; border-color: #38bdf8;">T</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #cbd5e1;">Play / Pause Interactive Simulation</span>
            <span class="datum-tag" style="color: #10b981; border-color: #10b981;">Space</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #cbd5e1;">Quick-Jump to Districts (1 to 7)</span>
            <span class="datum-tag" style="color: #a855f7; border-color: #a855f7;">1 - 7</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #cbd5e1;">Center Camera on Masterplan</span>
            <span class="datum-tag" style="color: #f59e0b; border-color: #f59e0b;">C</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #cbd5e1;">Toggle Procedural Audio FX</span>
            <span class="datum-tag" style="color: #f97316; border-color: #f97316;">M</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #cbd5e1;">Close Any Modal / Panel</span>
            <span class="datum-tag">Esc</span>
          </div>
        </div>

        <div style="padding: 12px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(5, 8, 16, 0.85); display: flex; justify-content: flex-end;">
          <button id="btn-close-shortcuts-btn" class="action-btn-primary" style="padding: 6px 14px; font-size: 11.5px;">Close</button>
        </div>
      </div>
    </div>
  `;

  container.querySelector('#btn-close-shortcuts').onclick = () => container.classList.add('hidden');
  container.querySelector('#btn-close-shortcuts-btn').onclick = () => container.classList.add('hidden');
  container.querySelector('.modal-overlay').onclick = (e) => {
    if (e.target.classList.contains('modal-overlay')) container.classList.add('hidden');
  };
}

function handleBuildingAction(building, isoCanvas, particleSystem) {
  sfx.simulationStep();
  const consoleEl = document.getElementById('action-console-log');
  if (!consoleEl) return;

  consoleEl.innerHTML = `<div style="color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-weight: 700;">⚡ DISPATCHING CIRCULATION FROM ${building.name.toUpperCase()}...</div>`;

  if (building.relationships && building.relationships.length > 0) {
    building.relationships.forEach((relId, idx) => {
      const targetB = isoCanvas.buildings.find(b => b.id === relId);
      if (targetB) {
        setTimeout(() => {
          particleSystem.spawnPacket(building, targetB, building.color || '#38bdf8', 0.025);
          sfx.pulse();
          consoleEl.innerHTML += `
            <div style="color: #cbd5e1; font-family: 'JetBrains Mono', monospace;">→ Vector routed to <strong style="color: #10b981;">${targetB.name}</strong></div>
          `;
        }, idx * 240);
      }
    });

    setTimeout(() => {
      consoleEl.innerHTML += `<div style="color: #10b981; font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-top: 4px;">✓ CIRCULATION SYNCHRONIZED ACROSS ARCHITECTURAL FABRIC!</div>`;
    }, building.relationships.length * 240 + 100);
  } else {
    consoleEl.innerHTML += `<div style="color: #94a3b8; font-family: 'JetBrains Mono', monospace;">No outbound conduits configured for node.</div>`;
  }
}

})();
